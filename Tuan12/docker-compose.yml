version: "3.9"
services: #danh sách container

  api:  #container chạy fastapi
    build: .
    container_name: fastapi_app

    ports:
      - "8000:8000"
    depends_on:    #nghĩa là chạy db trước
      - db
    environment:
      environment:
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/mydb

  db:  #container chạy postgresql
    image: postgres:16

    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

#chạy hệ thống bằng cách: docker-compose up -d --build
#up: chạy container
#-d: chạy nền
#--build: build lại image